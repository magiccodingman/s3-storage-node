name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=src ./scripts/test.sh

  linux-fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Verify real mount barriers fail closed
        env:
          RUN_PRIVILEGED_TESTS: "1"
        run: sudo --preserve-env=RUN_PRIVILEGED_TESTS,PYTHONPATH env PYTHONPATH="$GITHUB_WORKSPACE/src" python -m pytest -q tests/test_linux_fault_injection.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: s3-storage-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max